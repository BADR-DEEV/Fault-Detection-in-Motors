#include <Arduino.h>
#include <SPI.h>

// --- ESP32 VSPI HARDWARE PINS ---
const int CS_PIN = 5;
const int DRDY_PIN = 15;

// --- ADXL357 REGISTERS ---
const uint8_t REG_XDATA3 = 0x08;
const uint8_t REG_FILTER = 0x28;
const uint8_t REG_POWER  = 0x2D;
const uint8_t REG_RANGE  = 0x2C;

// +/- 40g range: 78 µg/LSB
const float SCALE_FACTOR_40G = 0.000078f;

// ESP32 VSPI default pins:
// SCK  = GPIO18
// MISO = GPIO19
// MOSI = GPIO23
// CS   = GPIO5
SPISettings adxlSettings(2000000, MSBFIRST, SPI_MODE0);

void writeRegister(uint8_t reg, uint8_t value) {
  SPI.beginTransaction(adxlSettings);
  digitalWrite(CS_PIN, LOW);

  SPI.transfer((reg << 1) | 0x00); // Write mode
  SPI.transfer(value);

  digitalWrite(CS_PIN, HIGH);
  SPI.endTransaction();
}

void readRegisters(uint8_t reg, uint8_t* buffer, int len) {
  SPI.beginTransaction(adxlSettings);
  digitalWrite(CS_PIN, LOW);

  SPI.transfer((reg << 1) | 0x01); // Read mode

  for (int i = 0; i < len; i++) {
    buffer[i] = SPI.transfer(0x00);
  }

  digitalWrite(CS_PIN, HIGH);
  SPI.endTransaction();
}

void setup() {
  Serial.setTxBufferSize(32768);
  Serial.begin(2000000);

  pinMode(CS_PIN, OUTPUT);
  digitalWrite(CS_PIN, HIGH);

  pinMode(DRDY_PIN, INPUT);

  SPI.begin(); 
  // Or explicitly:
  // SPI.begin(18, 19, 23, CS_PIN);

  delay(100);

  // RANGE REGISTER: +/- 40g
  writeRegister(REG_RANGE, 0x83);

  // FILTER REGISTER: 4000 Hz ODR
  writeRegister(REG_FILTER, 0x00);

  // POWER REGISTER: measurement mode
  writeRegister(REG_POWER, 0x00);

  delay(100);

  Serial.println("Time_us,X_g,Y_g,Z_g");
}

void loop() {
  if (digitalRead(DRDY_PIN) == HIGH) {
    unsigned long timestamp = micros();

    uint8_t buffer[9];
    readRegisters(REG_XDATA3, buffer, 9);

    int32_t x_raw = ((int32_t)buffer[0] << 12) | ((int32_t)buffer[1] << 4) | (buffer[2] >> 4);
    int32_t y_raw = ((int32_t)buffer[3] << 12) | ((int32_t)buffer[4] << 4) | (buffer[5] >> 4);
    int32_t z_raw = ((int32_t)buffer[6] << 12) | ((int32_t)buffer[7] << 4) | (buffer[8] >> 4);

    // Sign extend 20-bit values
    if (x_raw & 0x80000) x_raw |= 0xFFF00000;
    if (y_raw & 0x80000) y_raw |= 0xFFF00000;
    if (z_raw & 0x80000) z_raw |= 0xFFF00000;

    float x_g = x_raw * SCALE_FACTOR_40G;
    float y_g = y_raw * SCALE_FACTOR_40G;
    float z_g = z_raw * SCALE_FACTOR_40G;

    Serial.printf("%lu,%.4f,%.4f,%.4f\n", timestamp, x_g, y_g, z_g);
  }
}