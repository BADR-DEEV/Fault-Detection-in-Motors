<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blurred Low-Opacity Image Downloader</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 40px;
    background: #fafafa;
  }
  canvas {
    margin-top: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f5f5f5;
    max-width: 90%;
  }
  input { margin: 10px; }
  button {
    padding: 8px 12px;
    margin: 10px;
    cursor: pointer;
    border: none;
    background-color: #2563eb;
    color: white;
    border-radius: 6px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <h2>Blurred Low-Opacity Image Downloader</h2>
  <input type="file" id="fileInput" accept="image/*">
  <button id="downloadBtn" disabled>Download Soft Background Image</button>
  <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const downloadBtn = document.getElementById('downloadBtn');
let img = new Image();

// Adjust softness here ↓
const LOW_OPACITY = 0.23;  // 0.1–0.2 makes it faint
const BLUR_AMOUNT = 3;    // pixels of blur

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    img = new Image();
    img.onload = () => {
      // Resize canvas
      canvas.width = img.width;
      canvas.height = img.height;

      // Clear and apply blur filter
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = `blur(${BLUR_AMOUNT}px)`;
      ctx.globalAlpha = LOW_OPACITY;

      // Draw blurred + faint image
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Reset filter and alpha
      ctx.filter = "none";
      ctx.globalAlpha = 1.0;

      downloadBtn.disabled = false;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

downloadBtn.addEventListener('click', () => {
  canvas.toBlob(blob => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'soft_background.png';
    link.click();
    URL.revokeObjectURL(link.href);
  });
});
</script>
</body>
</html>
